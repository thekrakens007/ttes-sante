<app-client-navbar />

<div class="min-h-screen bg-gray-50 dark:bg-gray-900">

    <main
            class="mx-auto max-w-7xl
               px-4 py-8
               sm:px-6 lg:px-8">


        <!-- BREADCRUMB -->

        <app-page-breadcrumb
                pageTitle="Mon profil"
        />


        <!-- CONTENU -->

        <div
                class="rounded-2xl
                   border border-gray-200
                   bg-white p-5
                   dark:border-gray-800
                   dark:bg-white/[0.03]
                   lg:p-6">


            <div
                    class="mb-6 flex flex-col gap-4
               sm:flex-row sm:items-center
               sm:justify-between"
            >

                <h3
                        class="text-lg font-semibold
                   text-gray-800
                   dark:text-white/90"
                >

                    Mon profil

                </h3>


                <!-- BOUTON MES COMMANDES -->

                <a
                        routerLink="/my-orders"
                        class="inline-flex items-center justify-center
                   gap-2 rounded-lg
                   bg-brand-600 px-5 py-2.5
                   text-sm font-medium text-white
                   transition
                   hover:bg-brand-700"
                >

                    📦

                    <span>
            Mes commandes
        </span>

                </a>

            </div>


            <!-- LOADING -->

            @if (loading) {

                <div
                        class="flex items-center
                           justify-center py-10">

                    <div
                            class="text-sm text-gray-500
                               dark:text-gray-400">

                        Chargement du profil...

                    </div>

                </div>

            }


            <!-- ERROR -->

            @else if (errorMessage) {

                <div
                        class="rounded-lg
                           bg-red-50 p-4
                           text-sm text-red-600
                           dark:bg-red-500/10
                           dark:text-red-400">

                    {{ errorMessage }}

                </div>

            }


            <!-- PROFIL -->

            @else if (user) {

                <div class="space-y-6">

                    <app-user-meta-card
                            [user]="user"
                    />


                    <app-user-info-card
                            [user]="user"
                    />


                    <app-user-address-card
                            [user]="user"
                    />

                </div>

            }

        </div>

    </main>

</div>
