<div
        class="rounded-2xl border border-gray-200
           bg-white p-5 dark:border-gray-800
           dark:bg-white/[0.03] md:p-6">

    <div class="mb-6">

        <h3
                class="text-lg font-semibold
                   text-gray-800 dark:text-white/90">

            Modifier le stock

        </h3>

        @if (productName) {

            <p
                    class="mt-1 text-sm
                       text-gray-500 dark:text-gray-400">

                Produit :
                <span class="font-medium">
                    {{ productName }}
                </span>

            </p>

        }

    </div>


    @if (successMessage) {

        <div
                class="mb-5 rounded-lg border
                   border-green-200 bg-green-50
                   px-4 py-3 text-sm text-green-700">

            {{ successMessage }}

        </div>

    }


    @if (errorMessage) {

        <div
                class="mb-5 rounded-lg border
                   border-red-200 bg-red-50
                   px-4 py-3 text-sm text-red-700">

            {{ errorMessage }}

        </div>

    }


    <form
            [formGroup]="form"
            (ngSubmit)="submit()"
            class="space-y-6">


        <div>

            <label
                    class="mb-2 block text-sm font-medium
                       text-gray-700 dark:text-gray-400">

                Quantité actuelle

            </label>

            <input
                    type="number"
                    min="0"
                    formControlName="quantity"
                    class="h-11 w-full rounded-lg
                       border border-gray-300
                       bg-transparent px-4
                       text-sm text-gray-800
                       outline-none
                       dark:border-gray-700
                       dark:bg-gray-900
                       dark:text-white/90" />

        </div>


        <div>

            <label
                    class="mb-2 block text-sm font-medium
                       text-gray-700 dark:text-gray-400">

                Quantité minimale

            </label>

            <input
                    type="number"
                    min="0"
                    formControlName="minimumQuantity"
                    class="h-11 w-full rounded-lg
                       border border-gray-300
                       bg-transparent px-4
                       text-sm text-gray-800
                       outline-none
                       dark:border-gray-700
                       dark:bg-gray-900
                       dark:text-white/90" />

        </div>


        <div
                class="flex justify-end gap-3
                   border-t border-gray-200
                   pt-5 dark:border-gray-800">

            <button
                    type="button"
                    (click)="cancel()"
                    class="rounded-lg border
                       border-gray-300 px-5 py-2.5
                       text-sm font-medium
                       text-gray-700
                       hover:bg-gray-50
                       dark:border-gray-700
                       dark:text-gray-400">

                Annuler

            </button>


            <button
                    type="submit"
                    [disabled]="loading"
                    class="rounded-lg bg-brand-500
                       px-5 py-2.5 text-sm
                       font-medium text-white
                       hover:bg-brand-600
                       disabled:opacity-50">

                @if (loading) {

                    Enregistrement...

                } @else {

                    Mettre à jour

                }

            </button>

        </div>

    </form>

</div>
