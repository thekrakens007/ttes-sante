spring.application.name=ttes-icg-sante

# ========================================
# SERVER
# ========================================
server.address=0.0.0.0
server.port=8080

# ========================================
# DATABASE - LOCAL
# ========================================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/ttes_icg_sante
spring.datasource.username=postgres
spring.datasource.password=postgres

# ========================================
# HIKARI
# ========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# JPA
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# FLYWAY
# ========================================
spring.flyway.enabled=true

# ========================================
# MAIL
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================================
# APPLICATION
# ========================================
app.frontend-url=${FRONTEND_URL}
app.mail.from=${MAIL_FROM}

# ========================================
# GOOGLE
# ========================================
google.client-id=${GOOGLE_CLIENT_ID}


# ========================================
# CHATBOT N8N (mode test)
# ========================================
n8n.webhook-url=${N8N_WEBHOOK_URL:https://tsakengjr.n8n-host.com/webhook/ttes-chat}
#n8n.webhook-url=${N8N_WEBHOOK_URL:http://127.0.0.1:5678/webhook/ttes-chat}

# Timeouts du client HTTP (Spring Boot 3.4+)
spring.http.client.factory=simple
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s

logging.level.org.springframework.web.client=DEBUG