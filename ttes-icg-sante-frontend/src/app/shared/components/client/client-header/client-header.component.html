<header
        class="sticky top-0 z-50 w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
>

    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

        <!-- Logo -->
        <a
                routerLink="/"
                class="flex items-center"
        >
            <img
                    src="/images/logo/logo.svg"
                    alt="TES-ICG Santé"
                    class="h-12 w-auto dark:hidden"
            />

            <img
                    src="/images/logo/logo-dark.svg"
                    alt="TES-ICG Santé"
                    class="hidden h-12 w-auto dark:block"
            />
        </a>


        <!-- Navigation desktop -->
        <nav class="hidden items-center gap-8 md:flex">

            <a
                    routerLink="/"
                    routerLinkActive="text-brand-600"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="text-sm font-medium text-gray-700 transition hover:text-brand-600 dark:text-gray-300 dark:hover:text-brand-400"
            >
                Accueil
            </a>

            <a
                    routerLink="/products"
                    routerLinkActive="text-brand-600"
                    class="text-sm font-medium text-gray-700 transition hover:text-brand-600 dark:text-gray-300 dark:hover:text-brand-400"
            >
                Produits
            </a>

        </nav>


        <!-- Actions -->
        <div class="flex items-center gap-3">

            <!-- Recherche -->
            <button
                    type="button"
                    class="hidden h-10 w-10 items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 md:flex dark:text-gray-300 dark:hover:bg-gray-800"
                    aria-label="Rechercher"
            >

                <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                >
                    <path
                            d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    />
                </svg>

            </button>


            <!-- Panier -->
            <a
                    routerLink="/cart"
                    class="relative flex h-10 w-10 items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                    aria-label="Panier"
            >

                <svg
                        width="21"
                        height="21"
                        viewBox="0 0 24 24"
                        fill="none"
                >
                    <path
                            d="M3 3H5L7.4 14.4C7.6 15.3 8.4 16 9.3 16H18.5C19.4 16 20.2 15.4 20.4 14.5L22 8H6"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    />

                    <circle
                            cx="9"
                            cy="20"
                            r="1"
                            fill="currentColor"
                    />

                    <circle
                            cx="18"
                            cy="20"
                            r="1"
                            fill="currentColor"
                    />
                </svg>

            </a>


            <!-- Compte -->
            <a
                    routerLink="/login"
                    class="hidden items-center gap-2 rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 md:flex dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
            >

                <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                >
                    <path
                            d="M20 21C20 17.6863 16.866 15 13 15H11C7.13401 15 4 17.6863 4 21"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                    />

                    <circle
                            cx="12"
                            cy="7"
                            r="4"
                            stroke="currentColor"
                            stroke-width="2"
                    />
                </svg>

                <span>Connexion</span>

            </a>


            <!-- Menu mobile -->
            <button
                    type="button"
                    (click)="toggleMobileMenu()"
                    class="flex h-10 w-10 items-center justify-center rounded-lg text-gray-600 hover:bg-gray-100 md:hidden dark:text-gray-300 dark:hover:bg-gray-800"
                    aria-label="Menu"
            >

                @if (!mobileMenuOpen) {

                    <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                    >
                        <path
                                d="M4 6H20M4 12H20M4 18H20"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                        />
                    </svg>

                } @else {

                    <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                    >
                        <path
                                d="M6 6L18 18M18 6L6 18"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                        />
                    </svg>

                }

            </button>

        </div>

    </div>


    <!-- Menu mobile -->
    @if (mobileMenuOpen) {

        <div class="border-t border-gray-200 bg-white md:hidden dark:border-gray-800 dark:bg-gray-900">

            <nav class="mx-auto flex max-w-7xl flex-col px-4 py-4">

                <a
                        routerLink="/"
                        (click)="mobileMenuOpen = false"
                        class="rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                >
                    Accueil
                </a>

                <a
                        routerLink="/products"
                        (click)="mobileMenuOpen = false"
                        class="rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                >
                    Produits
                </a>

                <a
                        routerLink="/login"
                        (click)="mobileMenuOpen = false"
                        class="rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800"
                >
                    Connexion
                </a>

            </nav>

        </div>

    }

</header>
