<div
        class="group overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg dark:border-gray-800 dark:bg-gray-900"
>

    <!-- IMAGE -->
    <div
            class="relative flex h-56 items-center justify-center bg-gray-50 dark:bg-gray-800"
    >

        <img
                [src]="mainImage"
                [alt]="product.name"
                class="h-full w-full object-contain p-6 transition duration-300 group-hover:scale-105"
        />

        <!-- Prescription -->
        <div
                *ngIf="product.requiresPrescription"
                class="absolute left-3 top-3 rounded-full bg-red-100 px-3 py-1 text-xs font-medium text-red-700"
        >
            Ordonnance
        </div>

        <!-- Stock -->
        <div
                class="absolute right-3 top-3 rounded-full px-3 py-1 text-xs font-medium"
                [ngClass]="
        product.stock > 0
          ? 'bg-green-100 text-green-700'
          : 'bg-red-100 text-red-700'
      "
        >
            {{ product.stock > 0 ? 'Disponible' : 'Rupture' }}
        </div>

    </div>


    <!-- CONTENT -->
    <div class="p-5">

        <!-- Brand -->
        <p
                *ngIf="product.brand"
                class="mb-1 text-xs font-medium uppercase tracking-wide text-gray-400"
        >
            {{ product.brand }}
        </p>


        <!-- Name -->
        <h3
                class="mb-2 line-clamp-2 text-lg font-semibold text-gray-800 dark:text-white"
        >
            {{ product.name }}
        </h3>


        <!-- Form / Dosage -->
        <p
                *ngIf="product.form || product.dosage"
                class="mb-3 text-sm text-gray-500 dark:text-gray-400"
        >
            {{ product.form }}
            <span *ngIf="product.form && product.dosage"> • </span>
            {{ product.dosage }}
        </p>


        <!-- Company -->
        <p
                *ngIf="product.companyName"
                class="mb-4 text-sm text-gray-500 dark:text-gray-400"
        >
            {{ product.companyName }}
        </p>


        <!-- PRICE -->
        <div class="mb-4">

      <span
              class="text-xl font-bold text-brand-600 dark:text-brand-400"
      >
        {{ product.price | number:'1.0-0' }} FCFA
      </span>

        </div>
        <button
                type="button"
                (click)="addToCart()"
                [disabled]="product.stock <= 0 || addingToCart"
                class="w-full rounded-lg bg-brand-600 px-4 py-3 text-sm font-semibold text-white hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
    <span *ngIf="!addingToCart">
        Ajouter au panier
    </span>

            <span *ngIf="addingToCart">
        Ajout en cours...
    </span>
        </button>



    </div>

</div>
