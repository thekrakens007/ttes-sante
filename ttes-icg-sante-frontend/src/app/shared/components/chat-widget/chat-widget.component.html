
<!-- Bouton flottant -->
<button
        *ngIf="!isOpen"
        type="button"
        class="chat-launcher"
        aria-label="Ouvrir l'assistant TTES-ICG Santé"
        title="Discuter avec TTES-ICG Santé"
        (click)="toggleChat()"
>
    <!-- Logo pour le mode clair -->
    <img
            src="/images/logo/logo.svg"
            alt="TTES-ICG Santé"
            class="chat-launcher-logo dark:hidden"
    >

    <!-- Logo pour le mode sombre -->
    <img
            src="/images/logo/logo-dark.svg"
            alt="TTES-ICG Santé"
            class="chat-launcher-logo hidden dark:block"
    >
</button>

<!-- Fenêtre de discussion -->
<section
        *ngIf="isOpen"
        class="chat-panel"
        aria-label="Assistant TTES-ICG Santé"
>
    <header class="chat-header">
        <div class="assistant-avatar">
            <img
                    src="/images/logo/logo.svg"
                    alt="TTES-ICG Santé"
                    class="assistant-avatar-logo"
            >
        </div>

        <div class="assistant-info">
            <h2>Assistant TTES-ICG</h2>
            <p>
                <span class="online-dot"></span>
                Assistant en ligne
            </p>
        </div>

        <button
                type="button"
                class="close-button"
                aria-label="Fermer la discussion"
                (click)="toggleChat()"
        >
            ×
        </button>
    </header>

    <div class="chat-messages" #messageList aria-live="polite">
        <div
                *ngFor="let item of messages"
                class="message-row"
                [class.user-row]="item.role === 'user'"
        >
            <div
                    class="message-bubble"
                    [class.user-bubble]="item.role === 'user'"
            >
                {{ item.text }}
            </div>
        </div>

        <div *ngIf="isLoading" class="message-row">
            <div class="message-bubble loading-bubble">
                L'assistant prépare sa réponse…
            </div>
        </div>

        <p *ngIf="errorMessage" class="chat-error">
            {{ errorMessage }}
        </p>
    </div>

    <form class="chat-input-area" (ngSubmit)="sendMessage()">
        <input
                type="text"
                name="message"
                [(ngModel)]="message"
                placeholder="Écrivez votre message..."
                autocomplete="off"
                maxlength="2000"
                [disabled]="isLoading"
                aria-label="Votre message"
        />

        <button
                type="submit"
                class="send-button"
                [disabled]="isLoading || !message.trim()"
                aria-label="Envoyer le message"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22 2 11 13" />
                <path d="m22 2-7 20-4-9-9-4 20-7Z" />
            </svg>
        </button>
    </form>

    <footer class="chat-footer">
        TTES-ICG Santé · Assistant virtuel
    </footer>
</section>
