<div
        class="min-h-screen bg-gray-50 px-6 py-16 dark:bg-gray-950"
>

    <div
            class="mx-auto max-w-2xl text-center"
    >

        <!-- SUCCESS -->

        <div
                class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-green-100 text-4xl"
        >
            ✓
        </div>


        <h1
                class="text-3xl font-bold text-gray-900 dark:text-white"
        >
            Commande confirmée !
        </h1>


        <p
                class="mt-3 text-gray-500 dark:text-gray-400"
        >
            Merci pour votre commande.
            Nous allons traiter votre demande rapidement.
        </p>


        <!-- ORDER -->

        <div
                *ngIf="order"
                class="mt-8 rounded-2xl border border-gray-200 bg-white p-6 text-left shadow-sm dark:border-gray-800 dark:bg-gray-900"
        >

            <div
                    class="mb-5 flex justify-between"
            >

        <span class="text-gray-500">
          Numéro de commande
        </span>

                <strong
                        class="text-gray-900 dark:text-white"
                >
                    #{{ order.id }}
                </strong>

            </div>


            <div
                    class="mb-5 flex justify-between"
            >

        <span class="text-gray-500">
          Statut
        </span>

                <span
                        class="rounded-full bg-yellow-100 px-3 py-1 text-sm font-medium text-yellow-700"
                >
          {{ order.status }}
        </span>

            </div>


            <div
                    class="mb-5 flex justify-between"
            >

        <span class="text-gray-500">
          Total
        </span>

                <strong
                        class="text-xl text-brand-600"
                >
                    {{ formatPrice(order.totalAmount) }}
                </strong>

            </div>


            <div>

        <span class="text-gray-500">
          Livraison
        </span>

                <p
                        class="mt-1 font-medium text-gray-900 dark:text-white"
                >
                    {{ order.deliveryAddress }}
                </p>

            </div>

        </div>


        <!-- ACTIONS -->

        <div
                class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center"
        >

            <a
                    routerLink="/my-orders"
                    class="rounded-lg bg-brand-600 px-6 py-3 font-semibold text-white hover:bg-brand-700"
            >
                Mes commandes
            </a>


            <a
                    routerLink="/"
                    class="rounded-lg border border-gray-300 bg-white px-6 py-3 font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-900 dark:text-white"
            >
                Continuer mes achats
            </a>

        </div>

    </div>

</div>
