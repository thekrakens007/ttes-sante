<div class="min-h-screen bg-gray-50 px-4 py-8 dark:bg-gray-900">

    <div class="mx-auto max-w-7xl">

        <!-- TITRE -->
        <div class="mb-8">

            <h1
                class="text-2xl font-bold text-gray-900 dark:text-white"
            >
                Résultats de recherche
            </h1>

            <p
                class="mt-1 text-sm text-gray-500 dark:text-gray-400"
            >
                Recherche pour :
                <span class="font-semibold text-green-600">
                    "{{ keyword }}"
                </span>
            </p>

        </div>


        <!-- CHARGEMENT -->
        <div
            *ngIf="loading"
            class="py-16 text-center"
        >

            <div class="text-gray-500 dark:text-gray-400">
                Recherche en cours...
            </div>

        </div>


        <!-- ERREUR -->
        <div
            *ngIf="!loading && error"
            class="rounded-xl border border-red-200 bg-red-50 p-6 text-center text-red-600"
        >
            {{ error }}
        </div>


        <ng-container *ngIf="!loading && !error">


            <!-- ============================================ -->
            <!-- PRODUITS -->
            <!-- ============================================ -->

            <section
                *ngIf="products.length > 0"
                class="mb-12"
            >

                <div class="mb-5 flex items-center justify-between">

                    <h2
                        class="text-xl font-bold text-gray-900 dark:text-white"
                    >
                        Produits
                    </h2>

                    <span
                        class="text-sm text-gray-500 dark:text-gray-400"
                    >
                        {{ products.length }} résultat(s)
                    </span>

                </div>


                <div
                    class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4"
                >

                    <button
                        *ngFor="let product of products"
                        type="button"
                        (click)="openProduct(product)"
                        class="overflow-hidden rounded-2xl border border-gray-200 bg-white text-left shadow-sm transition hover:-translate-y-1 hover:shadow-lg dark:border-gray-700 dark:bg-gray-800"
                    >

                        <!-- IMAGE -->
                        <div
                            class="flex h-48 items-center justify-center bg-gray-100 dark:bg-gray-700"
                        >

                            <img
                                *ngIf="product.images?.length"
                                [src]="product.images[0].imageUrl"
                                [alt]="product.name"
                                class="h-full w-full object-cover"
                            >

                            <span
                                *ngIf="!product.images?.length"
                                class="text-4xl"
                            >
                                💊
                            </span>

                        </div>


                        <!-- INFORMATIONS -->
                        <div class="p-4">

                            <h3
                                class="line-clamp-2 font-semibold text-gray-900 dark:text-white"
                            >
                                {{ product.name }}
                            </h3>

                            <p
                                *ngIf="product.brand"
                                class="mt-1 text-sm text-gray-500"
                            >
                                {{ product.brand }}
                            </p>

                            <div
                                class="mt-3 flex items-center justify-between"
                            >

                                <span
                                    class="font-bold text-green-600"
                                >
                                    {{ product.price | number }} FCFA
                                </span>

                                <span
                                    *ngIf="product.stock > 0"
                                    class="text-xs text-green-600"
                                >
                                    En stock
                                </span>

                            </div>

                        </div>

                    </button>

                </div>

            </section>


            <!-- ============================================ -->
            <!-- PACKS -->
            <!-- ============================================ -->

            <section
                *ngIf="bundles.length > 0"
                class="mb-12"
            >

                <div class="mb-5 flex items-center justify-between">

                    <h2
                        class="text-xl font-bold text-gray-900 dark:text-white"
                    >
                        Packs
                    </h2>

                    <span
                        class="text-sm text-gray-500 dark:text-gray-400"
                    >
                        {{ bundles.length }} résultat(s)
                    </span>

                </div>


                <div
                    class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4"
                >

                    <button
                        *ngFor="let bundle of bundles"
                        type="button"
                        (click)="openBundle(bundle)"
                        class="overflow-hidden rounded-2xl border border-gray-200 bg-white text-left shadow-sm transition hover:-translate-y-1 hover:shadow-lg dark:border-gray-700 dark:bg-gray-800"
                    >

                        <!-- IMAGE PACK -->
                        <div
                            class="flex h-48 items-center justify-center bg-gray-100 dark:bg-gray-700"
                        >

                            <img
                                *ngIf="bundle.images?.length"
                                [src]="bundle.images[0].imageUrl"
                                [alt]="bundle.name"
                                class="h-full w-full object-cover"
                            >

                            <span
                                *ngIf="!bundle.images?.length"
                                class="text-4xl"
                            >
                                📦
                            </span>

                        </div>


                        <!-- INFORMATIONS -->
                        <div class="p-4">

                            <h3
                                class="line-clamp-2 font-semibold text-gray-900 dark:text-white"
                            >
                                {{ bundle.name }}
                            </h3>

                            <p
                                *ngIf="bundle.description"
                                class="mt-2 line-clamp-2 text-sm text-gray-500 dark:text-gray-400"
                            >
                                {{ bundle.description }}
                            </p>

                            <div
                                class="mt-4 flex items-center justify-between"
                            >

                                <span
                                    class="font-bold text-green-600"
                                >
                                    {{ bundle.price | number }} FCFA
                                </span>

                                <span
                                    *ngIf="bundle.stock > 0"
                                    class="text-xs text-green-600"
                                >
                                    En stock
                                </span>

                            </div>

                        </div>

                    </button>

                </div>

            </section>


            <!-- ============================================ -->
            <!-- AUCUN RÉSULTAT -->
            <!-- ============================================ -->

            <div
                *ngIf="!hasResults"
                class="rounded-2xl border border-gray-200 bg-white px-6 py-16 text-center dark:border-gray-700 dark:bg-gray-800"
            >

                <div class="mb-4 text-5xl">
                    🔎
                </div>

                <h2
                    class="text-lg font-semibold text-gray-900 dark:text-white"
                >
                    Aucun résultat
                </h2>

                <p
                    class="mt-2 text-sm text-gray-500 dark:text-gray-400"
                >
                    Aucun produit ou pack ne correspond à
                    "{{ keyword }}".
                </p>

            </div>

        </ng-container>

    </div>

</div>
