<div class="min-h-screen bg-gray-50 dark:bg-gray-950">


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <header
            class="sticky top-0 z-50 border-b border-gray-200
                   bg-white dark:border-gray-800 dark:bg-gray-900"
    >

        <div
                class="mx-auto flex max-w-7xl items-center
                       justify-between gap-6 px-4 py-4
                       sm:px-6 lg:px-8"
        >


            <!-- LOGO -->

            <a
                    routerLink="/"
                    class="flex items-center gap-3"
            >

                <img
                        src="/images/logo/logo.svg"
                        alt="TTES-ICG Santé"
                        class="h-10 w-auto"
                >

            </a>


            <!-- NAVIGATION -->

            <div class="flex items-center gap-3">


                <!-- PROFIL -->

                <button
                        type="button"
                        (click)="goToProfile()"
                        class="hidden rounded-lg
                               bg-brand-500 px-4 py-2
                               text-sm font-medium
                               text-white
                               hover:bg-brand-600
                               sm:block"
                >

                    👤 Mon profil

                </button>


                <!-- PANIER -->

                <button
                        type="button"
                        (click)="goToCart()"
                        class="hidden rounded-lg
                               bg-brand-500 px-4 py-2
                               text-sm font-medium
                               text-white
                               hover:bg-brand-600
                               sm:block"
                >

                    🛒 Mon panier

                </button>

            </div>

        </div>

    </header>



    <!-- ================================================= -->
    <!-- CONTENU -->
    <!-- ================================================= -->

    <main
            class="px-6 py-16"
    >

        <div
                class="mx-auto max-w-2xl text-center"
        >


            <!-- SUCCESS -->

            <div
                    class="mx-auto mb-6 flex h-20 w-20
                           items-center justify-center
                           rounded-full bg-green-100
                           text-4xl"
            >

                ✓

            </div>



            <!-- TITRE -->

            <h1
                    class="text-3xl font-bold
                           text-gray-900
                           dark:text-white"
            >

                Commande confirmée !

            </h1>



            <p
                    class="mt-3 text-gray-500
                           dark:text-gray-400"
            >

                Merci pour votre commande.

                <br>

                Nous allons traiter votre demande
                rapidement.

            </p>



            <!-- ================================================= -->
            <!-- INFORMATIONS COMMANDE -->
            <!-- ================================================= -->

            <div
                    *ngIf="order"
                    class="mt-8 rounded-2xl
                           border border-gray-200
                           bg-white p-6 text-left
                           shadow-sm
                           dark:border-gray-800
                           dark:bg-gray-900"
            >


                <!-- NUMERO -->

                <div
                        class="mb-5 flex
                               items-center
                               justify-between"
                >

                    <span
                            class="text-gray-500
                                   dark:text-gray-400"
                    >

                        Numéro de commande

                    </span>

                    <strong
                            class="text-gray-900
                                   dark:text-white"
                    >

                        #{{ order.id }}

                    </strong>

                </div>



                <!-- STATUT -->

                <div
                        class="mb-5 flex
                               items-center
                               justify-between"
                >

                    <span
                            class="text-gray-500
                                   dark:text-gray-400"
                    >

                        Statut

                    </span>

                    <span
                            class="rounded-full
                                   bg-yellow-100
                                   px-3 py-1
                                   text-sm font-medium
                                   text-yellow-700"
                    >

                        {{ order.status }}

                    </span>

                </div>



                <!-- TOTAL -->

                <div
                        class="mb-5 flex
                               items-center
                               justify-between"
                >

                    <span
                            class="text-gray-500
                                   dark:text-gray-400"
                    >

                        Total

                    </span>

                    <strong
                            class="text-xl
                                   text-brand-600
                                   dark:text-brand-400"
                    >

                        {{ formatPrice(order.totalAmount) }}

                    </strong>

                </div>



                <!-- LIVRAISON -->

                <div>

                    <span
                            class="text-gray-500
                                   dark:text-gray-400"
                    >

                        Livraison

                    </span>

                    <p
                            class="mt-1 font-medium
                                   text-gray-900
                                   dark:text-white"
                    >

                        {{ order.deliveryAddress }}

                    </p>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- ACTIONS -->
            <!-- ================================================= -->

            <div
                    class="mt-8 flex flex-col
                           gap-3 sm:flex-row
                           sm:justify-center"
            >


                <!-- MES COMMANDES -->

                <button
                        type="button"
                        (click)="goToOrders()"
                        class="rounded-lg
                               bg-brand-600
                               px-6 py-3
                               font-semibold
                               text-white
                               hover:bg-brand-700"
                >

                    Mes commandes

                </button>



                <!-- CONTINUER ACHATS -->

                <button
                        type="button"
                        (click)="goToShop()"
                        class="rounded-lg
                               border border-gray-300
                               bg-white px-6 py-3
                               font-semibold
                               text-gray-700
                               hover:bg-gray-50
                               dark:border-gray-700
                               dark:bg-gray-900
                               dark:text-white"
                >

                     Continuer mes achats

                </button>

            </div>



            <!-- RETOUR PROFIL -->

            <div class="mt-5">

                <button
                        type="button"
                        (click)="goToProfile()"
                        class="text-sm font-medium
                               text-gray-500
                               hover:text-brand-600"
                >

                    Retour à mon profil

                </button>

            </div>

        </div>

    </main>

</div>
