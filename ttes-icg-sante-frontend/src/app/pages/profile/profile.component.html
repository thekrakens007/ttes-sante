<app-page-breadcrumb pageTitle="Profile" />

<div
        class="rounded-2xl border border-gray-200 bg-white p-5
           dark:border-gray-800 dark:bg-white/[0.03]
           lg:p-6"
>

    <!-- HEADER -->

    <div
            class="mb-5 flex flex-col gap-4
               lg:mb-7 lg:flex-row lg:items-center
               lg:justify-between"
    >

        <h3
                class="text-lg font-semibold text-gray-800
                   dark:text-white/90"
        >
            Mon profil
        </h3>


        <!-- DECONNEXION -->

        <button
                type="button"
                (click)="logout()"
                class="inline-flex items-center justify-center
                   rounded-lg bg-red-500 px-5 py-2.5
                   text-sm font-medium text-white
                   transition hover:bg-red-600
                   focus:outline-none
                   focus:ring-2 focus:ring-red-500/30"
        >

            Déconnexion

        </button>

    </div>


    <!-- LOADING -->

    @if (loading) {

        <div
                class="flex items-center justify-center py-10"
        >

            <div
                    class="text-sm text-gray-500
                       dark:text-gray-400"
            >
                Chargement du profil...
            </div>

        </div>

    }


    <!-- ERROR -->

    @else if (errorMessage) {

        <div
                class="rounded-lg bg-red-50 p-4
                   text-sm text-red-600
                   dark:bg-red-500/10
                   dark:text-red-400"
        >

            {{ errorMessage }}

        </div>

    }


    <!-- PROFIL -->

    @else if (user) {

        <div class="space-y-6">

            <div>

                <app-user-meta-card
                        [user]="user"
                />

            </div>


            <div>

                <app-user-info-card
                        [user]="user"
                />

            </div>


            <div>

                <app-user-address-card
                        [user]="user"
                />

            </div>

        </div>

    }

</div>
