<app-auth-page-layout>
    <div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto text-center">

        @if (status === 'loading') {
        <div>
            <svg class="mx-auto h-8 w-8 animate-spin text-brand-500" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <p class="mt-4 text-sm text-gray-500 dark:text-gray-400">Vérification de votre email en cours...</p>
        </div>
        }

        @if (status === 'success') {
        <div>
            <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
                Email vérifié
            </h1>
            <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">{{ message }}</p>
            <app-button className="w-full" size="sm" (btnClick)="goToSignIn()">
                Se connecter
            </app-button>
        </div>
        }

        @if (status === 'error') {
        <div>
            <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
                Échec de la vérification
            </h1>
            <p class="mb-6 text-sm text-red-600 dark:text-red-400">{{ message }}</p>
            <a routerLink="/signup" class="text-brand-500 hover:text-brand-600 dark:text-brand-400 text-sm">
                Retour à l'inscription
            </a>
        </div>
        }

    </div>
</app-auth-page-layout>
